# Paystack Kafka External Event Configuration
# This file contains configuration properties for Paystack-specific Kafka external event processing

paystack:
  events:
    external:
      producer:
        kafka:
          # Async processing configuration
          async:
            # Thread pool configuration for async Kafka notification processing
            core-pool-size: 5                    # Minimum number of threads in the pool
            max-pool-size: 20                     # Maximum number of threads in the pool
            queue-capacity: 100                   # Queue capacity for pending tasks
            keep-alive-seconds: 60               # Time to keep idle threads alive
            thread-name-prefix: "paystack-kafka-notification-"  # Thread name prefix for identification
            max-retries: ${FINERACT_EXTERNAL_EVENTS_KAFKA_MAX_RETRIES:3} # Maximum number of retries for failed notifications

          # Enhanced producer configuration for real-time notifications
          producer:
            extra-properties:
              # Reliability settings
              acks: "all"                         # Wait for all replicas to acknowledge
              retries: 3                         # Number of retries for failed sends
              retry.backoff.ms: 100              # Backoff between retries
              request.timeout.ms: 30000          # Request timeout
              delivery.timeout.ms: 120000        # Total delivery timeout

              # Performance tuning
              batch.size: 16384                  # Batch size for better throughput
              linger.ms: 5                       # Wait up to 5ms to batch messages
              buffer.memory: 33554432            # 32MB buffer

              # Compression
              compression.type: "snappy"         # Compression for better network utilization

              # Idempotence and transactions
              enable.idempotence: true           # Enable idempotence for exactly-once semantics
              transactional.id: "paystack-kafka-producer"  # Transactional ID for reliability
